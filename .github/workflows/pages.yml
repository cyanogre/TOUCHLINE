# Publica el juego en GitHub Pages en cada push a main.
# Activa en GitHub: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar el sitio (solo los archivos del juego)
        run: |
          mkdir -p _site/data
          cp -r index.html manifest.webmanifest sw.js .nojekyll css js assets _site/
          cp -r data/game _site/data/
          cp "Strategic Swing.mp3" _site/
          # Versión del caché offline = commit actual
          sed -i "s/__BUILD__/${GITHUB_SHA::8}/" _site/sw.js
          du -sh _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
